# Documentation freshness — advisory, NOT a required check.
#
# `drift check` verifies that every binding in drift.lock still matches its
# target's AST fingerprint. A stale anchor means the code a doc describes moved
# without anyone re-reading the doc — it does NOT mean the doc is wrong, only
# that nobody has vouched for it since the change.
#
# This is the BACKSTOP, not the mechanism. The intended enforcement point is the
# agent/developer workflow (scripts/docs-governing.ts before an edit, `drift
# check` after); this job catches the change that skipped both.
#
# Job name is `docs`, never `tests` — branch protection targets the `tests` job
# in test.yml by name, and reusing it would fold this advisory job into the
# required gate (the same constraint blackbox.yml documents).
#
# Burn-in-then-promote, matching blackbox.yml: run advisory-only for roughly
# 2 weeks / ~50 PRs, including at least ONE drift version bump, before
# considering promotion to a required check. The version bump matters more here
# than elsewhere: `sig` is an AST fingerprint, so if drift changes how it
# normalizes trees, EVERY binding goes stale at once on an unrelated PR.
name: Docs

on:
  pull_request:
  push:
    branches: [main]

# Read-only, and no credentials left in the checkout. This job reads markdown,
# runs a third-party binary over it and reports a verdict — it never needs to
# write to the repo, and the drift install step is external code that should not
# inherit a usable token.
permissions:
  contents: read

jobs:
  docs:
    name: docs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # drift's JSON output attributes stale anchors via git blame, which
          # needs full history. Staleness detection itself does not.
          fetch-depth: 0
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.11 # keep in step with test.yml

      # Required before any tsc/bun test step: without it `tsc` resolves to a
      # floating latest rather than the lockfile's pinned TypeScript, and
      # bun-types is absent. Matches test.yml and blackbox.yml.
      - name: Install (frozen lockfile)
        run: bun install --frozen-lockfile

      # Pinned deliberately, both the action ref and the drift release. The
      # action defaults to version:latest; on a pre-1.0 tool whose signatures
      # are AST fingerprints, floating the version invites a repo-wide false
      # staleness event on a PR that changed nothing. Bump both on purpose.
      #
      # The ref is a COMMIT SHA, not the tag: a tag is mutable, and this step
      # runs third-party code. CONTRIBUTING.md pins the local installer to the
      # same v0.10.1 so the hook and this backstop cannot reach different
      # verdicts from different drift builds.
      - name: Install drift
        uses: fiberplane/drift@fc90540acb1a3f15ab3c90b4c8c9bac16c7a6522 # v0.10.1
        with:
          version: v0.10.1

      # The BACKSTOP. Runs the byte-for-byte same script as .githooks/pre-commit,
      # over the files this PR changed rather than the files a commit staged, so
      # a change that bypassed the hook (--no-verify, or a contributor who never
      # installed drift) still gets the same verdict here.
      - name: Check documentation freshness (same check as the pre-commit hook)
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -eu
          # NOT github.event.pull_request.base.sha. That is the commit the branch
          # FORKED FROM, so everything the base branch merged in the meantime
          # counts as this PR's changes — which made this very PR accountable for
          # a stale anchor introduced by #2 on main. That is precisely the
          # "blocking work that had nothing to do with it" failure the scoping
          # exists to prevent, so getting the base wrong quietly undoes it.
          #
          # On a pull_request, checkout gives the MERGE commit (base tip + PR
          # head), so the base tip is HEAD^1. If something checked out the PR
          # head directly instead (no second parent), the merge-base with the
          # base branch is the right answer and gives the same diff, because that
          # head does not contain the base's later commits either way.
          if [ "$EVENT_NAME" = "pull_request" ]; then
            if git rev-parse --verify -q HEAD^2 >/dev/null; then
              BASE_SHA=$(git rev-parse HEAD^1)
            else
              BASE_SHA=$(git merge-base "origin/${BASE_REF:-main}" HEAD)
            fi
          else
            BASE_SHA="$PUSH_BEFORE"
          fi
          # A first push to a new branch reports an all-zero "before" SHA, and a
          # force-push can leave a base that is no longer an ancestor. HEAD~1 is
          # the only fallback that is right on a push to the base branch itself,
          # where a merge-base against that branch would just return HEAD.
          if [ -z "${BASE_SHA:-}" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            BASE_SHA=$(git rev-parse HEAD~1)
          fi
          echo "Comparing against $BASE_SHA"
          # ACMD + --no-renames + -z, matching .githooks/pre-commit exactly. A
          # deleted or renamed binding target is a STALE anchor (file not
          # found); --diff-filter=ACM dropped it, and an unquoted list would
          # split a pathname containing a space into two non-matching paths.
          changed=()
          while IFS= read -r -d '' path; do
            changed+=("$path")
          done < <(git diff -z --name-only --no-renames --diff-filter=ACMD "$BASE_SHA" HEAD)
          [ "${#changed[@]}" -gt 0 ] || { echo "no files changed"; exit 0; }
          scripts/docs-check.sh "${changed[@]}"

      # Informational only: surfaces anchors that were ALREADY stale on main
      # before this PR. Never fails the job — this PR is not accountable for
      # drift it did not introduce, which is exactly why the gate above is
      # scoped. Use it to notice rot that slipped past the hook.
      - name: Full corpus status (informational)
        if: always()
        run: drift check || true

      - name: Typecheck the docs tooling
        run: bun run typecheck:scripts

      # Covers the reverse-lookup AND the changed-file plumbing that feeds it —
      # docs-check.test.ts runs the git-diff command lifted straight out of
      # .githooks/pre-commit, so a regression there fails here rather than
      # silently shrinking what the check ever sees.
      - name: Test the docs tooling
        run: bun test scripts/
