# Maintainer-only Nitpick PR review for Conduit — INTERNAL branches.
#
# The workflow definition is public, but the job runs only for branches in this
# repository. Pull requests from forks never receive maintainer secrets and
# never pull the private reviewer image; they are handled by pr-review-fork.yml,
# which is label-triggered, advisory, and checks out no fork code.
#
# The reviewer itself lives in nitpick-run.yml, called by both. Everything that
# differs between internal and fork review is in these two caller files: the
# trigger, the gate, the token scopes and the rate guards. A shared trigger is
# the one thing that must NOT be factored out — `pull_request` and
# `pull_request_target` are different security contexts.
#
# This repository is in a different owner (org) than queso/nitpick-flow, so it
# cannot consume nitpick-flow's private reusable workflow. nitpick-run.yml pulls
# the prebuilt per-flow image (Conduit engine + the nitpick flow baked at /flow)
# directly from GHCR instead.
#
# Prerequisites (one-time, done outside this file):
#   - repo secret FIREWORKS_AI_API_KEY — the OpenAI-compatible gateway key.
#   - repo secret GHCR_READ_PAT — a classic PAT with read:packages, able to pull
#     the private ghcr.io/queso/nitpick-flow image cross-org. (GITHUB_TOKEN
#     can't read another owner's package.)
name: Nitpick PR Review

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]

jobs:
  nitpick:
    # This is the maintainer boundary. A contributor must have permission to
    # push a branch to this repository before Nitpick can use maintainer secrets
    # on their pull request. Normal tests still run for fork PRs in test.yml,
    # and pr-review-fork.yml reviews them on request.
    if: >-
      github.event.pull_request.head.repo.fork == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      pull-requests: write
      packages: read
    uses: ./.github/workflows/nitpick-run.yml
    with:
      pr_number: ${{ github.event.pull_request.number }}
      head_sha: ${{ github.event.pull_request.head.sha }}
      # Empty: actions/checkout's default, the merge commit, which is what this
      # workflow has always reviewed. Safe here because the head is a branch in
      # this repository — see the gate above.
      checkout_ref: ''
      # BLOCKING. A blocking verdict fails the job; mark it a required check to
      # gate merge. The fork caller sets advisory: true instead, and why is
      # explained there.
      advisory: false
    secrets:
      conduit_api_key: ${{ secrets.FIREWORKS_AI_API_KEY }}
      ghcr_read_pat: ${{ secrets.GHCR_READ_PAT }}
