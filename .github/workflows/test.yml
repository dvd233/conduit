# Test gate — typecheck + full unit/integration suite on every PR.
#
# This is the required check for merging (branch protection targets the
# `tests` job by name). Keep it hermetic: no repo secrets, no .env — any test
# that needs gateway config must inject its own inert test values.
# Baseline at introduction: ~2.6k tests in under a minute locally; the
# timeout is generous headroom for slower shared runners, not an expectation.
#
# Run the scoped `bun run test` script (src/ only), NOT bare `bun test` —
# bun's default test discovery walks the whole repo tree, so a bare `bun
# test` would also pick up blackbox/ and fold that advisory-only suite into
# this required gate, defeating its non-blocking burn-in period (DQ-3).
name: Tests

on:
  pull_request:
  push:
    branches: [main]

# No write anywhere in this job: it checks out a pull request, installs
# dependencies and runs a suite. Declared rather than inherited, so the job
# keeps its own floor even if the repository default is ever widened back to
# write. A fork PR's token is read-only regardless; this covers the branch
# runs, which are the ones that carry a real token.
permissions:
  contents: read

jobs:
  tests:
    name: tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.11 # keep in step with the version developed against

      - name: Install (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      # Mutation check on the harness usage FOLD SITES (scripts/mutation-check.ts).
      #
      # A step in THIS job, not an advisory job of its own, and deliberately so.
      # blackbox.yml and docs.yml burn in advisory-first because they carry
      # flakiness this repo does not control — an external `drift` binary whose
      # AST fingerprints can go stale repo-wide on a version bump, and a
      # long-running journey suite. This check has neither exposure: same
      # runner, same lockfile, same `bun test` as the step above, fully
      # deterministic, ~3s for all five mutants. There is nothing to burn in.
      #
      # It belongs in the REQUIRED gate because of what it catches. The five
      # fold sites move real money into the run/wave budgets, and deleting one
      # breaks no type and no schema — issue #26 shipped with a dropped
      # HarnessResult past a green suite, and an early version of #26's own
      # tests passed with one of these folds removed. Green output is exactly
      # what this failure mode looks like, so a check that merely advises is a
      # check nobody reads at the moment it matters.
      #
      # The script restores every file it edits (finally + SIGINT/SIGTERM) and
      # verifies the restore byte-for-byte, so a failure here leaves no mutated
      # source behind for later steps.
      - name: Mutation check (harness usage fold sites)
        run: bun run test:mutation
